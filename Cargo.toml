[package]
name = "buildpilot"
# Stamped from VERSION by the build script; tests/structural checks the two agree (SRS OQ-12).
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "A build flight deck: remembers, launches, monitors and stops build scripts."
repository = "https://github.com/oernster/BuildPilot"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
slint = "1"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
