[package]
name = "buildpilot"
# Stamped from VERSION by the build script; tests/structural checks the two agree (SRS OQ-12).
version = "1.2.0"
edition = "2024"
license = "GPL-3.0-only"
description = "A build flight deck: remembers, launches, monitors and stops build scripts."
repository = "https://github.com/oernster/BuildPilot"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# Already built in through Slint; used directly to shrink operation icons once on load. The
# formats are ICON-004's.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }
raw-window-handle = "0.6"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
slint = { version = "1", features = ["raw-window-handle-06"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
serde_json = "1"
slint-build = "1"
winresource = "0.1.31"

[dev-dependencies]
# Slint's headless backend, pinned to the Slint in use, for driving the keyboard ring in tests.
i-slint-backend-testing = "=1.18.1"
tempfile = "3"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
